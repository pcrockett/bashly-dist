# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-hooks|${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195  # v5.2.5
      - run: just lint

  build-linux-x64:
    strategy:
      matrix:
        os: [linux, macos]
        arch: [x64, arm64]

    runs-on: ${{ case( matrix.os == 'linux' && matrix.arch == 'x64', 'ubuntu-22.04', matrix.os == 'linux' && matrix.arch == 'arm64', 'ubuntu-22.04-arm', matrix.os == 'macos' && matrix.arch == 'x64', 'macos-26-intel', matrix.os == 'macos' && matrix.arch == 'arm64', 'macos-26', 'ERROR' ) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .gem-cache
          key: gem-cache|${{ hashFiles('mise.toml') }}|${{ hashFiles('mise.lock') }}|${{ hashFiles('justfile') }}

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195  # v5.2.5

      - name: Determine latest version of Bashly
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "value=$(just latest-version)" >>"${GITHUB_OUTPUT}"

      - name: Build & Test
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          just build "${VERSION}" "${OS}" "${ARCH}"
          just test "${VERSION}" "${OS}" "${ARCH}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bashly-${{ steps.version.outputs.value }}-${{matrix.os}}-${{matrix.arch}}.tar.gz
          path: artifacts/bashly-${{ steps.version.outputs.value }}-${{matrix.os}}-${{matrix.arch}}.tar.gz

