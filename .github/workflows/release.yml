# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Bashly version to release (defaults to the latest upstream release)
        required: false
        type: string
        default: ""
  schedule:
    # once per day, at 04:34 UTC
    - cron: "34 4 * * *"

permissions:
  contents: read

jobs:

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      should_release: ${{ steps.exists.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195  # v5.2.5
      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if [ -z "${version}" ]; then
            version="$(just latest-version)"
          fi
          gh release view --repo bashly-framework/bashly "v${version}" >/dev/null
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
      - name: Check for existing release
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          if gh release view --repo "${GITHUB_REPOSITORY}" "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; skipping."
            echo "should_release=false" >>"${GITHUB_OUTPUT}"
          else
            echo "should_release=true" >>"${GITHUB_OUTPUT}"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    uses: $/.github/workflows/_build.yml
    with:
      version: ${{ needs.check.outputs.version }}

  publish:
    needs: [check, build]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: bashly-*
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "v${VERSION}" artifacts/*.tar.gz \
            --repo "${GITHUB_REPOSITORY}" \
            --title "v${VERSION}" \
            --notes "Locked distribution of [Bashly](https://bashly.dev/) v${VERSION}."
