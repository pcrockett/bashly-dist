# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Bashly version to build (defaults to the latest upstream release)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:

  resolve:
    if: inputs.version == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195  # v5.2.5
      - name: Determine latest version of Bashly
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "value=$(just latest-version)" >>"${GITHUB_OUTPUT}"

  build:
    needs: resolve
    if: ${{ !cancelled() && (needs.resolve.result == 'success' || needs.resolve.result == 'skipped') }}
    strategy:
      matrix:
        os: [linux, macos]
        arch: [x64, arm64]

    runs-on: ${{ case( matrix.os == 'linux' && matrix.arch == 'x64', 'ubuntu-22.04', matrix.os == 'linux' && matrix.arch == 'arm64', 'ubuntu-22.04-arm', matrix.os == 'macos' && matrix.arch == 'x64', 'macos-26-intel', matrix.os == 'macos' && matrix.arch == 'arm64', 'macos-26', 'ERROR' ) }}
    timeout-minutes: 30

    env:
      VERSION: ${{ inputs.version != '' && inputs.version || needs.resolve.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .gem-cache
          key: gem-cache|${{ hashFiles('mise.toml') }}|${{ hashFiles('mise.lock') }}|${{ hashFiles('justfile') }}

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195  # v5.2.5

      - name: Build
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          just build "${VERSION}" "${OS}" "${ARCH}"

      - name: Install modern Bash
        if: ${{ matrix.os == 'macos' }}
        run: |
          # a bashly CLI will be generated in the next step, but it requires at least
          # bash 4.2
          brew install bash

      - name: Test
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          just test "${VERSION}" "${OS}" "${ARCH}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: artifacts/bashly-${{ env.VERSION }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          archive: false

  build-musl:
    needs: resolve
    if: ${{ !cancelled() && (needs.resolve.result == 'success' || needs.resolve.result == 'skipped') }}
    strategy:
      matrix:
        arch: [x64]  # arm64 musl not supported by GitHub JavaScript runners at the moment

    runs-on: ${{ case( matrix.arch == 'x64', 'ubuntu-22.04', matrix.arch == 'arm64', 'ubuntu-22.04-arm', 'ERROR' ) }}
    timeout-minutes: 30
    # image ruby must track mise.lock's ruby major.minor: the gem extensions
    # bundled into the tarball are compiled against this image's ruby
    # [tag:musl-ruby-image]
    container: ruby:4.0-alpine@sha256:f1e530793cc09e1093417a4c9956069407155e1883d02beb30bda35ae54a47a3
    env:
      # ruby comes from the container image, so mise only manages just here
      MISE_ENABLE_TOOLS: just
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ inputs.version != '' && inputs.version || needs.resolve.outputs.version }}

    steps:
      - name: Install container packages
        run: apk add --no-cache bash build-base git tar

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check image ruby matches mise.lock
        run: |
          lock_minor="$(awk '/^\[\[tools\.ruby\]\]$/{getline; print $3}' mise.lock | tr -d '"' | cut -d. -f1-2)"
          image_minor="$(ruby -e 'print RUBY_VERSION.split(".")[0, 2].join(".")')"
          if [ "${lock_minor}" != "${image_minor}" ]; then
            echo "ERROR: image ruby ${image_minor} does not match mise.lock's ruby ${lock_minor}; update the container image digest"
            exit 1
          fi

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .gem-cache
          key: gem-cache|${{ hashFiles('mise.toml') }}|${{ hashFiles('mise.lock') }}|${{ hashFiles('justfile') }}

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195  # v5.2.5

      - name: Build & Test
        run: |
          just build "${VERSION}" linux "${ARCH}-musl"
          just test "${VERSION}" linux "${ARCH}-musl"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: artifacts/bashly-${{ env.VERSION }}-linux-${{ matrix.arch }}-musl.tar.gz
          archive: false
